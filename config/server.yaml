environment: ${MOON_RABBIT_ENVIRONMENT:PROD}
enableSwagger: ${MOON_RABBIT_ENABLE_SWAGGER:true}
enableMetrics: ${MOON_RABBIT_ENABLE_METRICS:true}

server:
  name: ${MOON_RABBIT_SERVER_NAME:rabbit}
  namespace: ${MOON_RABBIT_SERVER_NAMESPACE:moon}
  useRandomID: ${MOON_RABBIT_USE_RANDOM_NODE_ID:false}
  metadata:
    tag: ${MOON_RABBIT_METADATA_TAG:rabbit}
    repository: ${MOON_RABBIT_METADATA_REPOSITORY:https://github.com/aide-family/rabbit}
    author: ${MOON_RABBIT_METADATA_AUTHOR:Aide Family}
    email: ${MOON_RABBIT_METADATA_EMAIL:aidecloud@163.com}
  http:
    address: "${MOON_RABBIT_HTTP_ADDRESS:0.0.0.0:18080}"
    network: "${MOON_RABBIT_HTTP_NETWORK:tcp}"
    timeout: "${MOON_RABBIT_HTTP_TIMEOUT:10s}"
    protocol: HTTP
  grpc:
    address: "${MOON_RABBIT_GRPC_ADDRESS:0.0.0.0:19090}"
    network: "${MOON_RABBIT_GRPC_NETWORK:tcp}"
    timeout: "${MOON_RABBIT_GRPC_TIMEOUT:10s}"
    protocol: GRPC
  job:
    address: "${MOON_RABBIT_JOB_ADDRESS:0.0.0.0:17070}"
    network: "${MOON_RABBIT_JOB_NETWORK:tcp}"
    timeout: "${MOON_RABBIT_JOB_TIMEOUT:10s}"
    protocol: ${MOON_RABBIT_JOB_PROTOCOL:GRPC}

jwt:
  secret: "${MOON_RABBIT_JWT_SECRET:xxx}"
  expire: "${MOON_RABBIT_JWT_EXPIRE:600s}"
  issuer: "${MOON_RABBIT_JWT_ISSUER:rabbit}"

main:
  dialector: ${MOON_RABBIT_MAIN_DIALECTOR:MYSQL}
  debug: ${MOON_RABBIT_MAIN_DEBUG:true}
  useSystemLogger: ${MOON_RABBIT_MAIN_USE_SYSTEM_LOGGER:true}
  options:
    '@type': "${MOON_RABBIT_MAIN_OPTIONS_TYPE:type.googleapis.com/rabbit.config.MySQLOptions}"
    username: "${MOON_RABBIT_MAIN_USERNAME:root}"
    password: "${MOON_RABBIT_MAIN_PASSWORD:123456}"
    host: "${MOON_RABBIT_MAIN_HOST:localhost}"
    port: ${MOON_RABBIT_MAIN_PORT:3306}
    database: ${MOON_RABBIT_MAIN_DATABASE:rabbit}
    parameters:
      charset: utf8mb4
      parseTime: "true"
      loc: Asia/Shanghai
    dsn: "${MOON_RABBIT_MAIN_DSN:./rabbit.db?cache=shared}"

jobCore:
  workerTotal: ${MOON_RABBIT_JOB_CORE_WORKER_TOTAL:10}
  timeout: "${MOON_RABBIT_JOB_CORE_TIMEOUT:10s}"
  bufferSize: ${MOON_RABBIT_JOB_CORE_BUFFER_SIZE:1000}
  
report:
  reportType: ${MOON_RABBIT_REPORT_TYPE:ETCD}
  namespace: ${MOON_RABBIT_REPORT_NAMESPACE:moon}
  options:
    '@type': "${MOON_RABBIT_REPORT_OPTIONS_TYPE:type.googleapis.com/rabbit.config.ETCDOptions}"
    endpoints: ${MOON_RABBIT_REPORT_ENDPOINTS:127.0.0.1:2379}
    username: ${MOON_RABBIT_REPORT_USERNAME:}
    password: ${MOON_RABBIT_REPORT_PASSWORD:}
    dialTimeout: ${MOON_RABBIT_REPORT_DIALECT_TIMEOUT:5s}
    kubeConfig: ${MOON_RABBIT_REPORT_KUBECONFIG:~/.kube/config}

cluster:
  name: ${MOON_RABBIT_CLUSTER_NAME:moon.rabbit}
  endpoints: ${MOON_RABBIT_CLUSTER_ENDPOINTS:}
  timeout: ${MOON_RABBIT_CLUSTER_TIMEOUT:10s}
  protocol: ${MOON_RABBIT_CLUSTER_PROTOCOL:GRPC}

swaggerBasicAuth:
  enabled: ${MOON_RABBIT_SWAGGER_BASIC_AUTH_ENABLED:false}
  username: ${MOON_RABBIT_SWAGGER_BASIC_AUTH_USERNAME:moon.rabbit}
  password: ${MOON_RABBIT_SWAGGER_BASIC_AUTH_PASSWORD:rabbit.swagger}

metricsBasicAuth:
  enabled: ${MOON_RABBIT_METRICS_BASIC_AUTH_ENABLED:false}
  username: ${MOON_RABBIT_METRICS_BASIC_AUTH_USERNAME:moon.rabbit}
  password: ${MOON_RABBIT_METRICS_BASIC_AUTH_PASSWORD:rabbit.metrics}

configPaths: ${MOON_RABBIT_CONFIG_PATHS:}
messageLogPath: ${MOON_RABBIT_MESSAGE_LOG_PATH:}